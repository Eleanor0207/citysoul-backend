# Alembic configuration (issue #31).
#
# NOTE: this file must stay ASCII-only. Alembic reads it through configparser
# with encoding="locale", which on a zh-TW Windows machine means cp950 -- any
# Chinese comment here raises UnicodeDecodeError before alembic even starts.
# Commentary that wants to be in Chinese belongs in migrations/env.py.
#
# There is deliberately no sqlalchemy.url here. This file is version
# controlled, so a database password must never appear in it. The connection
# string comes from app.core.config.settings (which reads the gitignored .env)
# and is set in migrations/env.py. The line that alembic init generates,
# `sqlalchemy.url = driver://user:pass@localhost/dbname`, was removed: leaving
# it in place is an invitation to fill in a real password.
#
# Revision ids are assigned by hand (0001, 0002, ...) rather than using
# alembic's random hashes. Migrations are an ordered thing; the filenames
# should sort in that order.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
