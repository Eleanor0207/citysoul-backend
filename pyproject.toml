[project]
name = "citysoul"
version = "0.1.0"
description = "城市靈魂 AR 遊戲 — 後端（FastAPI）"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg[binary]==3.2.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "redis==5.0.8",
    "python-dotenv==1.0.1",
    "pyjwt==2.9.0",
    "pgvector==0.3.6",
    "tzdata>=2026.3",
    # B1 Vertex AI（ADR-0001）。憑證走 ADC，不需要額外的金鑰套件（ADR-0003）。
    "google-genai>=1.60",
    # B10 TTS（#21）。憑證同樣走 ADC，不需要金鑰套件（ADR-0003）。
    # texttospeech 做合成，storage 放音檔——客戶端要的是 URL，中間一定有存放。
    "google-cloud-texttospeech>=2.16",
    "google-cloud-storage>=2.18",
    # S12 紀念照片（#44）：FastAPI 的 UploadFile／multipart 解析需要它。
    "python-multipart>=0.0.9",
    "alembic>=1.19.0",
    "google-cloud-texttospeech>=2.37.0",
    "google-cloud-storage>=3.13.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    # 從 ==0.27.2 放寬：google-genai 需要 >=0.28.1。TestClient 走 httpx，
    # 全套測試通過即代表這個升級沒有破壞既有行為。
    "httpx>=0.28.1",
]

[tool.uv]
package = false
