# B9 當日情境的人工審核輪播池（brain.daily_event_curated_notes）。
#
# 這些不是玩家看到的文字。它們是餵給 B9 的「補充」素材，模型據此寫一段 40–80 字
# 的第一人稱短敘事——見 app/modules/brain/daily_event.py 的 build_daily_event_prompt。
#
# ## 輪播規則
#
# 選哪一則由 `event_date.toordinal() % len(active notes)` 決定，沒有游標、不存狀態
# （daily_event_sources.py:86-93）。所以七則就是七天一輪，改順序只在人工調整
# rotation_order 時發生。
#
# ## 寫法上的三個限制
#
# - 不代神明發言、不談靈驗與吉凶（CONTEXT.md 的宗教安全下限，龍山寺與城隍廟尤其）
# - 不寫查不到來源的具體斷言（幾點開門、幾點早課、某年某月的單一事件）
# - 寫可觀察的常態，不寫新聞——新聞有自己的來源，這一池是「這個地方平常的樣子」


place_id: longshan_temple
display_name: 艋舺龍山寺
reviewed_by: Jessie_Lee

notes:
  - rotation_order: 0
    note_text: 天亮前就有人在前殿排隊點第一炷香，鐘鼓聲比人聲早。
  - rotation_order: 1
    note_text: 正午的日頭打在中殿的龍柱上，石獅被摸過的地方特別亮。
  - rotation_order: 2
    note_text: 下午廟埕旁的長椅坐滿了下棋、聊天的老人家，聲音比殿內大。
  - rotation_order: 3
    note_text: 下雨天屋簷的剪黏顏色變沉，滴水沿著簷角連成一條線。
  - rotation_order: 4
    note_text: 志工在後殿換供品與鮮花，一整排花材週期性地換過一輪。
  - rotation_order: 5
    note_text: 假日參拜的人裡觀光客居多，導覽的解說聲此起彼落。
  - rotation_order: 6
    note_text: 入夜點燈後燈籠把石雕的影子拉長，廟埕比白天安靜得多。
