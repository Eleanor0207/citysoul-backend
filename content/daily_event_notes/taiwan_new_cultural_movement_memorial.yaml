# B9 當日情境的人工審核輪播池（brain.daily_event_curated_notes）。
#
# 這些不是玩家看到的文字。它們是餵給 B9 的「補充」素材，模型據此寫一段 40–80 字
# 的第一人稱短敘事——見 app/modules/brain/daily_event.py 的 build_daily_event_prompt。
#
# ## 輪播規則
#
# 選哪一則由 `event_date.toordinal() % len(active notes)` 決定，沒有游標、不存狀態
# （daily_event_sources.py:86-93）。所以七則就是七天一輪，改順序只在人工調整
# rotation_order 時發生。
#
# ## 寫法上的三個限制
#
# - 不代神明發言、不談靈驗與吉凶（CONTEXT.md 的宗教安全下限，龍山寺與城隍廟尤其）
# - 不寫查不到來源的具體斷言（幾點開門、幾點早課、某年某月的單一事件）
# - 寫可觀察的常態，不寫新聞——新聞有自己的來源，這一池是「這個地方平常的樣子」


place_id: taiwan_new_cultural_movement_memorial
display_name: 臺灣新文化運動紀念館
reviewed_by: Jessie_Lee

notes:
  - rotation_order: 0
    note_text: 扇形拘留所的走道從中央看出去，每一間都在同一道視線裡。
  - rotation_order: 1
    note_text: 展示以文字與檔案為主，看展的人走得比別的地方慢。
  - rotation_order: 2
    note_text: 大稻埕的街聲從外面傳進來，跟館內的安靜對比明顯。
  - rotation_order: 3
    note_text: 1933 年的流線型外牆在雨後顏色更深。
  - rotation_order: 4
    note_text: 團體導覽在扇形空間裡回音大，講解要放慢。
  - rotation_order: 5
    note_text: 有觀眾看完會在留言本上寫下感想。
  - rotation_order: 6
    note_text: 傍晚閉館後，街上的燈比館內先亮。
