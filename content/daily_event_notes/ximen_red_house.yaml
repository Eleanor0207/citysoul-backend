# B9 當日情境的人工審核輪播池（brain.daily_event_curated_notes）。
#
# 這些不是玩家看到的文字。它們是餵給 B9 的「補充」素材，模型據此寫一段 40–80 字
# 的第一人稱短敘事——見 app/modules/brain/daily_event.py 的 build_daily_event_prompt。
#
# ## 輪播規則
#
# 選哪一則由 `event_date.toordinal() % len(active notes)` 決定，沒有游標、不存狀態
# （daily_event_sources.py:86-93）。所以七則就是七天一輪，改順序只在人工調整
# rotation_order 時發生。
#
# ## 寫法上的三個限制
#
# - 不代神明發言、不談靈驗與吉凶（CONTEXT.md 的宗教安全下限，龍山寺與城隍廟尤其）
# - 不寫查不到來源的具體斷言（幾點開門、幾點早課、某年某月的單一事件）
# - 寫可觀察的常態，不寫新聞——新聞有自己的來源，這一池是「這個地方平常的樣子」


place_id: ximen_red_house
display_name: 西門紅樓
reviewed_by: Jessie_Lee

notes:
  - rotation_order: 0
    note_text: 八角堂正面的紅磚在西曬時偏橙。
  - rotation_order: 1
    note_text: 週末市集的攤位擺在十字樓外，人聲從下午一路熱到晚上。
  - rotation_order: 2
    note_text: 劇場散場時觀眾從側門湧出，旁邊的座位跟著滿起來。
  - rotation_order: 3
    note_text: 白天的人多在拍立面，入夜之後人群改往南廣場。
  - rotation_order: 4
    note_text: 雨天屋簷下擠著避雨的人，攤商用塑膠布蓋住商品。
  - rotation_order: 5
    note_text: 外牆整修過幾輪，磚色的深淺看得出批次。
  - rotation_order: 6
    note_text: 平日午後最安靜，只有清潔人員在廣場來回。
