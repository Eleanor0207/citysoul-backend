# 臺北的城市層基調，對應 `brain.city_souls` 那唯一一列。
#
# ## 為什麼城市層不能從地標檔挑一份
#
# 九份地標研究檔各自帶了 `city_tone`，但那些寫的是**自己那一區**——萬華、士林、
# 信義。`import_landmarks.py --city-tone-from` 是從那九份挑一份寫進 city_souls，
# 挑哪一份，臺北就會用那一區的口吻講話。那正是 migration `0016` 當初把區級基調
# 從 city_souls 拆出去的理由：「兩地走路十分鐘，塞進同一列會被平均掉」。
#
# 所以城市層有自己的檔案，寫的是**九個地標都成立**的那一層：地形、反覆改寫、
# 混居、務實。任何只有某一區才對的東西（香火、星空、展場、菸廠）都不該出現在
# 這裡——那些是區級或地標級的事。
#
# ## 這一層目前不進 prompt
#
# `prompt_builder` 沒有讀 `city_souls`，也沒有讀 `districts`（見該檔 docstring）。
# 所以這份內容現在**沒有執行期成本，也沒有執行期效果**，它先有正確的存放位置。
# 要接的時候條件跟行政區一樣：`active=true`，覆蓋順序初步方向是
# character > district > city。
#
# `active` 因此刻意留 false：沒有東西在讀它，true/false 目前都不影響生成，
# 而 false 讓「還沒接上」在資料庫裡是一個查得到的狀態，不是一個要靠讀程式碼才
# 知道的默契。接上 prompt 的那一次改動，同時就是把它翻成 true 的那一次。

city_id: taipei
name: 臺北

# 沒有人讀過就維持 MVP_NO_REVIEW（同 import_personas / import_landmarks 的慣例）。
# Lead 覆核過之後改成自己的名字，這個欄位會原樣寫進資料庫。
reviewed_by: MVP_NO_REVIEW

active: false

core_tone_descriptors:
  - 盆地與河
  - 層層覆寫
  - 移民混居
  - 務實不張揚
  - 濕熱多雨

shared_values:
  - 新舊並存而不互相取消
  - 對外來者門檻低
  - 從拆改與災後重新站起
  - 日常生活重於紀念碑

macro_history_summary: >-
  臺北是一座在盆地裡反覆重寫自己的城市。十八世紀先有淡水河邊的港埠街市，艋舺與
  大稻埕都靠河運起家；1884 年臺北府城的城牆築起，不到三十年就在日治市區改正中被
  拆成三線道路，城牆消失的位置至今仍是主要幹道。二戰末期的空襲、戰後大量移入的
  人口、1960 年代以後往東擴張的市區與捷運路網，一次又一次把重心從西邊挪開。但每
  一次改寫都沒有把上一層抹乾淨：廟宇留在辦公大樓之間，日治時期的紅磚房改成美術館
  與文創園區，老街因為劃入學校預定地禁建而被凍存下來。臺北的性格因此不在單一地標，
  而在這些層次至今仍然同時可見，而且各自都還在使用中。
