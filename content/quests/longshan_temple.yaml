# 重修的痕跡（q_longshan_repair_trace）——萬華主線任務
#
# ⚠️ **觀察點內容為 MVP 展示用途自行擬定，未經實地勘查。**
#
# 文件 §10.3 要求觀察點先寫進正式內容、不要求玩家找不存在的物件。這裡的
# 三個（或兩個）觀察點是照街區既有的公共特徵擬的，**沒有經過現場核對**，
# 所以 `review_status` 是 DRAFT。實地勘查（CL#25）之後要逐一核對、改寫或
# 替換成已審核的示意文案，再把 review_status 改成人名。
#
# 匯入：`python -m scripts.import_quests --dry-run`

spirit_id: longshan_temple
review_status: DRAFT

quests:
  - quest_id: q_longshan_repair_trace
    title: 重修的痕跡
    quest_type: story
    # 完成這個任務之後才推得動的劇情節點（brain.story_beats）。
    story_beat_id: beat_longshan_clue
    intro: >-
      龍山寺與艋舺街區歷經多次毀壞與重修。走一圈，找出那些被補過、換過、接過的地方。
    # 可選的景象拍照。**不是完成條件**（文件 §13）——不拍也能交件。
    optional_photo_evidence: ls_public_roofline_photo
    steps:
      - step_id: ls_roofline
        title: 屋簷下的接線
        hint: >-
          站在公共外觀看得到的屋簷輪廓，找出兩段顏色或質地不一樣的交界。
      - step_id: ls_stone_step
        title: 被摸亮的石面
        hint: >-
          公共動線上被經年累月摸過、磨過而發亮的石面或木面。
