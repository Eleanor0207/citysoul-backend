# 兩種形狀（q_redhouse_two_forms）——萬華主線任務
#
# ⚠️ **觀察點內容為 MVP 展示用途自行擬定，未經實地勘查。**
#
# 文件 §10.3 要求觀察點先寫進正式內容、不要求玩家找不存在的物件。這裡的
# 三個（或兩個）觀察點是照街區既有的公共特徵擬的，**沒有經過現場核對**，
# 所以 `review_status` 是 DRAFT。實地勘查（CL#25）之後要逐一核對、改寫或
# 替換成已審核的示意文案，再把 review_status 改成人名。
#
# 匯入：`python -m scripts.import_quests --dry-run`

spirit_id: ximen_red_house
review_status: DRAFT

quests:
  - quest_id: q_redhouse_two_forms
    title: 兩種形狀
    quest_type: story
    # 完成這個任務之後才推得動的劇情節點（brain.story_beats）。
    story_beat_id: beat_redhouse_clue
    intro: >-
      紅樓是八角與十字兩種形狀接起來的。找出那兩種形狀相接的位置。
    # 可選的景象拍照。**不是完成條件**（文件 §13）——不拍也能交件。
    optional_photo_evidence: rh_public_facade_photo
    steps:
      - step_id: rh_octagon_edge
        title: 八角的邊
        hint: >-
          從公共廣場側看得到的八角外牆，數一數它轉了幾次。
      - step_id: rh_joint
        title: 兩塊接起來的地方
        hint: >-
          八角與後方十字量體相接的那一段外牆輪廓。
