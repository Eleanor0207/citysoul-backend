  macro_history_summary: 大同區大稻埕沿淡水河埠頭而興，自清末頂下郊拚後成為臺灣茶葉出口與郊商貿易重鎮。霞海城隍廟伴隨迪化街南北貨、中藥材與布業發展，見證了大稻埕從茶香歲月、日治文化運動到當代老街創生的輝煌轉型。
