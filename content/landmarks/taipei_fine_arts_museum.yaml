  macro_history_summary: 中山區擁抱淡水河與基隆河交會的圓山門戶，歷史上匯聚了美軍協防時代的國際記憶、當代藝文樞紐（北美館）、條通與晴光商圈的常民文化。臺北市立美術館以其前衛的現代建築與雙年展國際視野，為中山區注入了前瞻、開放且深具美學思維的當代都市性格。
