  macro_history_summary: 西門町自日治時期起即被規劃為日人娛樂與商業中心，戰後承接了來自大江南北的影視、飲食與商場文化，並逐漸演化為青少年次文化與性別友善的潮流重鎮。西門紅樓以其多重身分的演變，展現了西門町百變、前衛且包容萬象的都市性格。
