  macro_history_summary: 士林區擁抱陽明山山麓美景與外雙溪自然水系，歷史上匯聚了傳統文風、外雙溪宮殿式博物館群（故宮）、芝山岩考古史蹟以及當代夜市常民文化。國立故宮博物院以其宏偉的仿古宮殿與豐富珍藏，為士林區注入了深厚的藝術底蘊與國際級文化觀光動能。
