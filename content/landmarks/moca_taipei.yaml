  macro_history_summary: 大同區身為台北傳統舊城區，一方面保有大稻埕的茶香、廟宇與傳統常民生活；另一方面，以台北當代藝術館與赤峰街聚落為核心，展現出極富活力的新舊對話。從殖民教育、市政樞紐到當代前衛藝術空間，大同區展示了都市歷史紋理轉化為創新文化動能的深厚底蘊。
