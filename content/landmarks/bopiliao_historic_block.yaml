  macro_history_summary: 萬華作為臺北最早發展的港埠聚落，以龍山寺為宗教信仰中心，剝皮寮則為周邊商業與庶民生活的延伸。從清代郊商貨運通道、日治市區改正開闢新路，到戰後禁建凍結與老街保存運動，萬華展現了極具韌性的市井生命力與多元歷史層疊。
