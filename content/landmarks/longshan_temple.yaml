  macro_history_summary: 艋舺（今萬華）為臺北市最早發展的街市之一，依傍淡水河港口而興。龍山寺自乾隆年間建廟以來，即為漢人移民信仰中心與社會治安自治樞紐，見證了頂下郊拚的移民拓墾衝突、日治時期的傳統重修與現代化演變，以及二次大戰大空襲後的重建重生。其綿延不絕的香火紀錄了臺北近三百年來的市井百態與基層生活記憶。
