# 地標官方公告來源（backend#71／SDD §20.3.3）。
#
# ⚠️ **2026-08-22：清單刻意是空的——九個地標盤查過，沒有一個有可用的 feed。**
#
# 不是還沒填，是沒有東西可填。逐一探測過九個官方網域（含常見的 rss、feed、
# Rss.aspx、News_Rss.aspx 等路徑，以及首頁的 application/rss+xml link 標籤）：
#
# - 龍山寺、西門紅樓、剝皮寮、新文化運動紀念館、天文館、當代館、松山文創：無
# - 故宮 https://www.npm.gov.tw/Rss.aspx 是合法 RSS 2.0，但 item 數為 0，空殼
# - 北美館 /template/RSS.aspx 目前回「網站維護中」的 HTML，不是 feed
#
# 所以官方公告在 MVP 走**人工錄入**——`official_event` 那一列本來就支援，這支
# 抓取模組是同一類輸入的第二個生產者，不是唯一生產者。抓取器保留不刪：未來
# 任一地標開了 feed，填一行就能用。詳見 backend#71 的盤查留言。
#
# 空清單是正常狀態，不是設定錯誤——抓取器會直接回 0，當日情境照常走節慶日曆
# 與輪播池。填進來之後，排程每天跑一次，把公告寫進 `daily_event_calendars`
# 的 `official_event` 列，B9 那邊不用改。
#
# ## 什麼可以填
#
# **只有該地標自己的官方網域**：廟方、館方的 RSS 或公告頁。
#
# 不可以填：
#
# - 新聞媒體的報導（即使內容正確）——那是二手來源
# - 社群平台（Threads／FB／IG）——`daily_event.py` 的白名單明文禁止 UGC
# - 聚合器、搜尋結果頁——來源清單保證的是「這個網域是官方的」，聚合器不是
#
# 抓取器還會再檢查一次：feed 裡的項目若連到別的網域，那一條整個丟掉。官方
# feed 裡出現轉貼是常見的事。
#
# ## 格式
#
# ```yaml
# sources:
#   - place_id: longshan_temple
#     feed_url: https://<廟方官方網域>/news/rss.xml
# ```
#
# `place_id` 的值必須跟 `content/spirits.yaml` 的 **`spirit_id`** 一致（那份檔案
# 沒有叫 `place_id` 的欄位，兩邊是同一組字串、不同欄位名）。填錯不會有錯誤——
# 公告只會掛到一個不存在的地標上，然後永遠不會被讀到。

