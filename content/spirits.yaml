# 靈魂實體與角色身分。`scripts/import_spirits.py` 讀這一份。
#
# ## 座標對齊客戶端的召喚點
#
# `latitude` / `longitude` 取自客戶端 `Assets/StreamingAssets/tiles/near/index.json`
# 的 `summon_points`，**不是地標的公開位置**。
#
# 這兩者原本是各走各的：這份 YAML 抄地標的公開座標，召喚點則是近景圖磚的原點。
# 2026-08-15 量過一次，九個召喚點裡有七個離對應的靈魂超過 50 公尺的召喚半徑，
# 最遠的剝皮寮與新文化運動紀念館各差 300 公尺——玩家站在地圖 pin 上按召喚，
# 後端會判定不在範圍內。只有龍山寺（22 m）與松山（28 m）是能用的。
#
# 對齊的方向是後端跟著客戶端，因為近景圖磚是照召喚點算出來的，反過來改要重產
# 圖磚。`霞海城隍廟` 還沒有近景文件，沒有召喚點可對，維持公開座標。
#
# ⚠️ 這些值仍然**沒有經過實地勘查**。召喚點應該是「安全、公開、不需要進入受管制
# 場館」的位置——那要人站在現場才判斷得出來（龍山寺就是這樣定在廟埕前廣場而不是
# 殿內）。對齊只是讓兩邊不再互相矛盾，不代表位置選對了。實地勘查之後，客戶端與
# 這一份要一起覆蓋，不能只改一邊。
#
# ## 半徑沿用龍山寺的 50 / 150
#
# SDD 的召喚半徑 50 公尺、感應半徑 150 公尺。不為個別地標調整——半徑是玩法參數，
# 不是地標屬性，各自調整會讓「走近就能召喚」這件事在不同地標有不同手感。
#
# ## safety_gate
#
# 開了的地標，每輪對話會先跑一次 B4 輸入分類（多一次 Gemini 呼叫，延遲與成本
# 加倍），不安全的提問在**呼叫生成之前**就被婉拒。
#
# 只給風險高的開：玩家問天文館「文物該不該還給對岸」的機率，跟問故宮差了一個
# 量級。全開等於為了三個地標讓十個一起變慢。沒寫就是 false。
#
# ## voice：每隻靈魂的嗓音（0031）
#
# 匯入 `brain.character_voices`。沒寫 `voice:` 的靈魂**不會被寫入**——「還沒配音」
# 與「配成預設值」是兩件事，後者看起來像有人決定過。查不到的靈魂在執行期退回
# `settings.tts_voice_name`（目前是 None，等於讓 Google 自己挑）。
#
# ### 性別的來源是 3D 模型，不是人格卡
#
# 人格卡一律用「祂」——那是刻意的，人設寫的是**地方**不是人。所以性別唯一的依據
# 是美術做出來的模型（`citysoul-client/.../Characters/*.fbx`）。
# 2026-08-23 逐一算圖判定：3 男（龍山寺、松菸、當代館）、6 女。
# 2026-08-25 更新：新文化運動紀念館重做成男性學生，改為 4 男、5 女。
#
# ### 只有 3 個講者，其餘靠 rate/pitch 拉開
#
# `cmn-TW` 只有 6 個嗓音 = 3 個講者 × 2 種品質，可辨識音色是 **1 女（A）2 男（B、C）**，
# 沒有任何 Chirp3-HD。九隻靈魂配不滿，所以同一把嗓音要靠語速與音高做變體。
#
# ⚠️ **這只能拉開，不能真的變成九個人。** 同一個講者的音色底子還在，連著聽仍聽得出
# 是同一把。要真正區分只有換語系（`cmn-CN` 有 38 個嗓音）或換供應商——那是產品決定。
#
# `pitch` 超過 ±4 半音會有明顯電子感，所以除了當代館以外一律壓在 ±3 內。
#
# ### ⚠️ 當代館用女聲，不是筆誤
#
# 當代館定案是**小男孩**風格，而 `cmn-TW` 沒有兒童嗓音——B 與 C 都是成年男性。
# 把成年男聲 pitch 拉高不會變成小男孩，只會變成「體型比較小的成年男人」，
# 共鳴腔的質感不會跟著變。動畫與遊戲配男童的慣例本來就是用女聲，所以這裡是
# `Wavenet-A` +4 半音。
#
# ## character_id 的命名
#
# `{地名}_{英文角色定位詞}`，地名取短的那一段，不重複整個 spirit_id
# （既有值是 `longshan_watcher` 而非 `longshan_temple_watcher`）。
# 定位詞用角色在敘事裡的功能，不用角色暱稱（SDD §7.3.1）。

spirits:
  # 龍山寺 2026-08-20 才補進這一份。在那之前它是唯一不由本檔管理的靈魂——資料庫裡
  # 有、線上服務中，但這裡沒有條目，所以座標、半徑、safety_gate 全都改不到。上面那段
  # 座標對齊的註解甚至引用了它（「只有龍山寺（22 m）與松山（28 m）是能用的」），
  # 卻沒有對應的列。座標與 character_id 取自當時線上實際值，不是重新指定的。
  #
  # ## safety_gate 為什麼開
  #
  # 它是垂直切片唯一的靈魂，而且開在**仍在運作的宗教場所**。CONTEXT.md 的宗教場域
  # 邊界四條（不代神明給指示、不預測個人吉凶姻緣財運、不比較信仰優劣、不給具體
  # 醫療法律投資建議）是人格卡的安全下限，但在 B4 關閉時，那四條**只存在於 prompt
  # 裡**——沒有任何分類器會在生成之前擋下來。
  #
  # 這裡的風險不是法律責任，是寺方關係：一張「城市靈魂幫我解籤」的截圖就足以終結
  # 合作，而合作是專案的存亡條件（見 backend#50 寺方接洽、#41 內容治理）。延遲與
  # 成本加倍換這個，划算。
  - spirit_id: longshan_temple
    safety_gate: true
    display_name: 艋舺龍山寺
    character_id: longshan_watcher
    latitude: 25.037398
    longitude: 121.499732
    voice:
      name: cmn-TW-Wavenet-C
      speaking_rate: 0.88
      pitch: -2.0
      # 中年男性，灰白髮鬍。三百年的守望者，「不疾不徐、講到年代久遠會放慢」

  # ⚠️ 2026-08-22：改回 25.042100 / 121.506800，**推翻**先前依 wanhua 近景文件
  # 做的那次校正（曾改成 25.042138 / 121.506282，兩者差 52 m）。
  #
  # 理由：這個點就在**紅樓大門**。召喚半徑只有 50 m，而 52 m 的偏移足以讓一個
  # 站在大門口的玩家召喚不到——那是這條主線第二站的入口。近景文件的召喚點是
  # 從圖面推的，這一個是實際的門口位置，以後者為準。
  #
  # 要再改之前先確認新座標到大門的距離小於 50 m，否則就是把同一個問題換個方向
  # 再犯一次。
  - spirit_id: ximen_red_house
    display_name: 西門紅樓
    character_id: red_house_collector
    latitude: 25.042100
    longitude: 121.506800
