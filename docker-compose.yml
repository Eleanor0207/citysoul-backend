services:
  db:
    # 自建映像檔（issue #46）：官方 pgvector/pgvector:pg16 只有 pgvector，
    # 沒有 PostGIS（brain.districts 地理圍欄需要）。改動這個映像檔要
    # `docker compose up -d --build`，見 Dockerfile.postgres 的說明。
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: city_soul
      POSTGRES_PASSWORD: city_soul_dev
      POSTGRES_DB: city_soul
    ports:
      - "5432:5432"
    volumes:
      - city_soul_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  city_soul_pgdata:
