services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: citysoul-db:pg16-postgis
    environment:
      POSTGRES_USER: city_soul
      POSTGRES_PASSWORD: city_soul_dev
      POSTGRES_DB: city_soul
    ports:
      - "5432:5432"
    volumes:
      - city_soul_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  city_soul_pgdata:
