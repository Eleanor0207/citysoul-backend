services:
  db:
    # 自建映像檔：pgvector 官方映像檔 + PostGIS。兩個 extension 都要有，
    # 跟 Cloud SQL 上會啟用的組合一致（見 Dockerfile.postgres）。
    # 改過 Dockerfile.postgres 之後要 `docker compose up -d --build` 才會生效。
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: city_soul
      POSTGRES_PASSWORD: city_soul_dev
      POSTGRES_DB: city_soul
    ports:
      - "5432:5432"
    volumes:
      - city_soul_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  city_soul_pgdata:
