name: contract

# 只在 PR 時跑：契約閘門的意義是「在 merge 前擋下破壞性變更」，跟 main 自己
# 比對自己沒有意義。
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  breaking-changes:
    runs-on: ubuntu-latest
    # PR 標籤 breaking-change 可以跳過這道閘門（規範要求同時提交 v2 路由，
    # 但那是 review 把關的流程規範，不是這裡能強制的事）。
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change') }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # 需要 base branch 的歷史才能拿到 PR 之前那版 contracts/openapi.json。
          fetch-depth: 0

      - run: git fetch --depth=1 origin ${{ github.base_ref }}

      # 這個 repo 第一次加入 contracts/openapi.json 的那次 PR，base 分支上
      # 還沒有這個檔案——git show 找不到路徑會失敗，這裡當作「沒有舊契約可比」
      # 直接放行，而不是讓 job 紅在一個跟破壞性變更無關的原因上。
      - name: resolve previous contract snapshot
        id: base_contract
        run: |
          if git show "origin/${{ github.base_ref }}:contracts/openapi.json" > /tmp/base-openapi.json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # fail-on: ERR（不是 WARN）——只擋真正的破壞性變更（刪欄位／改型別／
      # 改必填），純新增欄位放行（SDD v2.1 §11.2.1）。
      #
      # review: false——這是 private repo 的內部契約，不上傳到 oasdiff.com
      # 做側欄比較連結，即使內容是加密的。
      - name: check for breaking changes
        if: steps.base_contract.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.12
        with:
          base: /tmp/base-openapi.json
          revision: contracts/openapi.json
          fail-on: ERR
          review: false
