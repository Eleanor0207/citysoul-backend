name: test

# 只認 main。功能分支要驗證就開 PR——那也是唯一會需要驗證的時候。
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

# 同一個分支連推兩次時，取消還在跑的舊的那次。private repo 的 Actions 額度
# 是有上限的，而已經被取代的那次結果沒有人會看。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://city_soul:city_soul_dev@localhost:5432/city_soul
      REDIS_URL: redis://localhost:6379/0

      # CI 專用的假金鑰。三把**必須兩兩不同**——只要有兩把相同，那兩種 token
      # 就能互相冒充，而 SDD 第6節的分層驗證正是靠它們不同才成立。有測試在驗
      # 這件事，所以這裡填成一樣的話 CI 會紅，而不是靜靜地失去保護。
      #
      # 這些不是秘密，不需要放 GitHub secrets：它們只在這個容器裡活幾分鐘，
      # 而且簽出來的 token 除了測試自己以外沒有任何東西會接受。
      SESSION_TOKEN_SECRET: ci-session-secret
      ENCOUNTER_TOKEN_SECRET: ci-encounter-secret
      SENSE_TOKEN_SECRET: ci-sense-secret

      # ⚠️ 刻意**沒有**任何 GCP 憑證（ADR-0003：不產生 service account 金鑰，
      # 也不把金鑰塞進 secrets）。Gemini 的真實呼叫測試在沒有憑證時會自動 skip，
      # 所以 CI 不需要碰 GCP。真的要在 CI 打 Vertex AI 的話，走 Workload
      # Identity Federation 換發短期 token，不要加 secrets。

    steps:
      - uses: actions/checkout@v7

      # db 不能寫成 `services:`，因為 services 只接受現成映像檔、不能 build。
      # 我們同時需要 `vector`（B6 記憶檢索）與 `postgis`（區域圍欄），而沒有
      # 官方映像檔兩個都有（見 issue #46），所以這裡跟 docker-compose.yml 一樣
      # 走自建映像檔——用同一份 Dockerfile.postgres，CI 與本機不會分岔。
      - name: start postgres (pgvector + postgis)
        run: |
          docker build -f Dockerfile.postgres -t citysoul-db .
          docker run -d --name citysoul-db \
            -e POSTGRES_USER=city_soul \
            -e POSTGRES_PASSWORD=city_soul_dev \
            -e POSTGRES_DB=city_soul \
            -p 5432:5432 \
            citysoul-db

      # `services:` 本來用 health-check 幫我們等，手動起容器就得自己等。
      # 少了這步，後面會在 Postgres 還沒接受連線時就開始跑，而失敗訊息是
      # 「connection refused」，看起來像設定錯誤而不是時序問題。
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec citysoul-db pg_isready -U city_soul; then exit 0; fi
            sleep 2
          done
          echo "postgres 沒有在 60 秒內就緒"
          docker logs citysoul-db
          exit 1

      # 沒有浮動的 v9 major tag（最新 release 是 v9.0.0，但 astral-sh 的
      # 浮動 major tag 只出到 v7），所以這裡釘完整版號。
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # .python-version 鎖 3.12（psycopg[binary] 的 wheel 供應狀況，見 README）
      - run: uv sync --frozen

      # 一路建到最新版。這同時也是「全新空資料庫可以從零建起來」的驗證——
      # 開發機上的資料庫是逐步演化來的，證明不了這件事。
      - name: alembic upgrade head
        run: uv run python -m alembic upgrade head

      # 每一支 migration 都能退。README 說了這句話，這裡讓它每次 commit 都被驗。
      # 退到底再建回來，比 `downgrade -1` 涵蓋得更完整，而且在空資料庫上很快。
      - name: migrations are reversible
        run: |
          uv run python -m alembic downgrade base
          uv run python -m alembic upgrade head

      # models 與 migration 對不上時，這一步會紅。
      #
      # 這是整套 Alembic 設計的守門員：少了它，有人在 models.py 加一個欄位卻
      # 忘記寫 migration，測試仍然全綠（conftest 跑的是 migration，那個欄位
      # 根本不存在，而剛好沒有測試碰到它），然後在部署時才炸。
      - name: models match migrations
        run: uv run python -m alembic check

      - run: uv run python -m pytest -q

  # 契約閘門（issue #30）。
  #
  # 擋的是「後端無聲地改壞 API、客戶端 runtime 才炸」。以 3 天一個 Sprint 的
  # 節奏，加上後端與客戶端分屬兩個 repo，這件事會頻繁發生。
  #
  # 跟 test job 分開是刻意的：這個 job 不需要資料庫，也不需要跑 migration，
  # 而且它失敗時的訊息應該是「你改壞了契約」，不該混在測試輸出裡。
  contract-gate:
    runs-on: ubuntu-latest

    # 只有 PR 才有「舊版契約」可以比對。push 到 main 時 base 就是自己，比了
    # 沒有意義——那時候守著契約的是 pytest 的「快照未過期」那條。
    #
    # `breaking-change` 標籤可以跳過閘門，但**必須同時提交 v2 路由**
    # （SDD v2.1 §11.2.1）。那是流程規範，由 review 把關，不由工具強制——
    # 貼標籤是一個顯式的意圖表態，讓破壞性變更不會在趕 Sprint 時被順手放行。
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'breaking-change')

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      # 先確認 PR 裡的快照本身是新的。少了這步，下面比對的可能是一份過期的
      # 快照——那等於在比一個不存在的 API，閘門會靜默失效。
      #
      # 這條在本機 `pytest` 也會跑到（tests/test_api_contract.py），這裡重跑
      # 一次是為了讓「快照過期」的失敗訊息出現在契約閘門這個 job，而不是被埋
      # 在 200 多條測試的輸出裡。
      - name: contract snapshot is up to date
        env:
          SESSION_TOKEN_SECRET: ci-session-secret
          ENCOUNTER_TOKEN_SECRET: ci-encounter-secret
          SENSE_TOKEN_SECRET: ci-sense-secret
        run: |
          uv run python -m scripts.generate_openapi_contract
          git diff --exit-code contracts/openapi.json || {
            echo "::error::contracts/openapi.json 過期了。跑 uv run python -m scripts.generate_openapi_contract 並一起 commit。"
            exit 1
          }

      # base 分支的契約，當作比對基準。
      - name: fetch base contract
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:contracts/openapi.json > /tmp/base-openapi.json \
            || echo '{}' > /tmp/base-openapi.json

      # 破壞性變更（刪欄位／改型別／改必填）讓 build 失敗；純新增欄位放行。
      # 「只加不減」是 SDD v2.1 §11.2.1 定的相容原則。
      #
      # ⚠️ 這個 job 還沒有在真實 PR 上跑過（本機 session 沒有 push 權限），
      # 語法是照 oasdiff 官方文件寫的。第一次開 PR 時請確認它不會噴。
      - name: breaking change check
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: /tmp/base-openapi.json
          revision: contracts/openapi.json
          fail-on: ERR
