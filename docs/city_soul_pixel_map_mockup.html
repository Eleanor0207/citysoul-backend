<h2 class="sr-only">城市靈魂 AR 遊戲手機介面模擬：像素風地圖搭配搜尋列、召喚點標記、當日氛圍卡片與底部導覽列</h2>
<div style="display:flex; justify-content:center; padding:1rem 0;">
<div style="width:320px; background:var(--surface-1); border-radius:20px; padding:10px; border:0.5px solid var(--border-strong);">
  <div style="position:relative; width:300px; height:560px; border-radius:14px; overflow:hidden; background:#2b3a2f;">

    <canvas id="pixelmap" width="60" height="94" style="position:absolute; top:0; left:0; width:300px; height:470px; image-rendering:pixelated;"></canvas>

    <div style="position:absolute; top:0; left:0; width:300px; height:470px;">
      <div style="position:absolute; top:14px; left:12px; right:12px; display:flex; align-items:center; gap:8px; background:#f5efd8; border:3px solid #2c2416; padding:8px 10px; border-radius:2px;">
        <i class="ti ti-message-circle-2" style="font-size:16px; color:#2c2416;" aria-hidden="true"></i>
        <span style="font-size:11px; color:#5a4d33; font-family:var(--font-mono); flex:1;">跟城市靈魂聊聊...</span>
        <i class="ti ti-microphone" style="font-size:16px; color:#2c2416;" aria-hidden="true"></i>
      </div>

      <div style="position:absolute; top:62px; left:12px; right:12px; display:flex; gap:6px; overflow:hidden;">
        <span style="font-size:10px; background:#f5efd8; border:2px solid #2c2416; padding:4px 8px; color:#2c2416; font-family:var(--font-mono);">召喚點</span>
        <span style="font-size:10px; background:#f5efd8; border:2px solid #2c2416; padding:4px 8px; color:#2c2416; font-family:var(--font-mono);">當日情境</span>
        <span style="font-size:10px; background:#f5efd8; border:2px solid #2c2416; padding:4px 8px; color:#2c2416; font-family:var(--font-mono);">收藏</span>
      </div>

      <div style="position:absolute; top:150px; left:150px; text-align:center;">
        <div style="width:22px; height:22px; margin:0 auto; background:#e2913a; border:2px solid #2c2416; border-radius:50%;"></div>
        <div style="width:0; height:0; margin:0 auto; border-left:5px solid transparent; border-right:5px solid transparent; border-top:7px solid #2c2416;"></div>
        <span style="font-size:9px; background:#2c2416; color:#f5efd8; padding:2px 5px; font-family:var(--font-mono);">天文館靈魂</span>
      </div>

      <div style="position:absolute; top:260px; left:90px; width:12px; height:12px; background:#3a7bd5; border:2px solid #0c2a52; border-radius:50%;"></div>
    </div>

    <div style="position:absolute; bottom:0; left:0; right:0; background:#f5efd8; border-top:3px solid #2c2416; padding:10px 14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:12px; color:#2c2416; font-family:var(--font-mono);">當地氛圍</span>
        <span style="font-size:11px; color:#5a4d33; font-family:var(--font-mono);"><i class="ti ti-cloud" style="font-size:13px; vertical-align:-2px;" aria-hidden="true"></i> 26° · 空氣佳</span>
      </div>
      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:6px;">
        <div style="text-align:center; padding:8px 4px; background:#fff; border:2px solid #2c2416;">
          <i class="ti ti-map-pin" style="font-size:16px; color:#2c2416;" aria-hidden="true"></i>
          <div style="font-size:9px; color:#2c2416; font-family:var(--font-mono); margin-top:2px;">探索</div>
        </div>
        <div style="text-align:center; padding:8px 4px; background:#fff; border:2px solid #2c2416;">
          <i class="ti ti-star" style="font-size:16px; color:#2c2416;" aria-hidden="true"></i>
          <div style="font-size:9px; color:#2c2416; font-family:var(--font-mono); margin-top:2px;">任務</div>
        </div>
        <div style="text-align:center; padding:8px 4px; background:#fff; border:2px solid #2c2416;">
          <i class="ti ti-heart" style="font-size:16px; color:#2c2416;" aria-hidden="true"></i>
          <div style="font-size:9px; color:#2c2416; font-family:var(--font-mono); margin-top:2px;">共鳴值</div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
(function(){
  var c = document.getElementById('pixelmap');
  var ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  var W = 60, H = 94;

  ctx.fillStyle = '#7fae6a';
  ctx.fillRect(0,0,W,H);

  for (var y=0;y<H;y++){
    for (var x=0;x<W;x++){
      if ((x+y) % 9 === 0) { ctx.fillStyle = '#729e5f'; ctx.fillRect(x,y,1,1); }
    }
  }

  ctx.fillStyle = '#5b9bd5';
  for (var y=0;y<H;y++){
    for (var x=0;x<W;x++){
      if (x > W - y*0.35 - 6) ctx.fillRect(x,y,1,1);
    }
  }

  ctx.fillStyle = '#d9cfa8';
  for (var x=0;x<W;x++){ ctx.fillRect(x,20,1,3); }
  for (var y=0;y<H;y++){ ctx.fillRect(14,y,3,1); }
  for (var y=0;y<H;y++){ ctx.fillRect(34,y,3,1); }
  for (var x=0;x<W;x++){ ctx.fillRect(x,55,1,3); }

  var buildings = [
    [3,3,6,7],[3,12,6,6],[3,25,6,7],[3,34,6,8],
    [19,3,12,5],[19,10,5,7],[26,10,5,7],
    [19,25,5,6],[26,25,5,6],[19,33,12,6],
    [38,3,4,10],[44,3,4,10],[38,15,4,8],
    [3,60,6,8],[3,70,6,8],[19,60,12,6],[19,68,5,10],
    [38,60,4,12],[44,60,4,12]
  ];
  ctx.fillStyle = '#a89078';
  buildings.forEach(function(b){ ctx.fillRect(b[0],b[1],b[2],b[3]); });
  ctx.fillStyle = '#8a7460';
  buildings.forEach(function(b){ ctx.fillRect(b[0],b[1],b[2],2); });

})();
</script>
