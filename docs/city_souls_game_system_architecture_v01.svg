<svg viewBox="0 0 1000 1010" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC',sans-serif" role="img" aria-label="城市靈魂系統架構圖">
<rect x="0" y="0" width="1000" height="1010" fill="#FBFBF7"/>

<!-- 標題 -->
<text x="30" y="42" font-family="'Space Grotesk',monospace" font-size="12" font-weight="700" fill="#1F6F5C" letter-spacing="1.5">城市靈魂 AR 遊戲 · SYSTEM ARCHITECTURE</text>
<text x="30" y="75" font-size="26" font-weight="900" fill="#123D33">多層系統架構圖</text>
<text x="30" y="98" font-size="13" fill="#4B5D55">GPS 召喚 × AR 顯現 × AI 動態人格（GCP MVP）</text>

<!-- 圖例 -->
<g font-family="'Noto Sans TC',sans-serif" font-size="12" fill="#4B5D55">
<rect x="500" y="30" width="14" height="14" rx="4" fill="#FF6A4C"/><text x="520" y="41">玩家端</text>
<rect x="590" y="30" width="14" height="14" rx="4" fill="#1F6F5C"/><text x="610" y="41">API 層</text>
<rect x="670" y="30" width="14" height="14" rx="4" fill="#123D33"/><text x="690" y="41">資料層</text>
<rect x="500" y="58" width="14" height="14" rx="4" fill="#C77B2E"/><text x="520" y="69">素材 / CDN</text>
<rect x="620" y="58" width="14" height="14" rx="4" fill="#B8860B"/><text x="640" y="69">外部服務</text>
</g>

<g transform="translate(0,130)">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#4B5D55"/>
</marker>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#FF6A4C"/>
</marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#1F6F5C"/>
</marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#B8860B"/>
</marker>
</defs>

<!-- 5 個泳道分區背景 -->
<rect x="0" y="0" width="1000" height="150" fill="#FFF5F2" opacity="0.6"/>
<rect x="0" y="150" width="1000" height="180" fill="#F0F7F1" opacity="0.6"/>
<rect x="0" y="330" width="1000" height="170" fill="#F5F8F5" opacity="0.7"/>
<rect x="0" y="500" width="1000" height="160" fill="#FFF3E5" opacity="0.6"/>
<rect x="0" y="660" width="1000" height="220" fill="#FFFAE8" opacity="0.6"/>

<!-- 泳道標題 -->
<text x="16" y="24" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#FF6A4C" letter-spacing="1.5">CLIENT · 玩家手機（AR 運算全在此端）</text>
<text x="16" y="174" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#1F6F5C" letter-spacing="1.5">API LAYER · Cloud Run</text>
<text x="16" y="354" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#123D33" letter-spacing="1.5">DATA LAYER · Cloud SQL(pgvector) + Memorystore Redis</text>
<text x="16" y="524" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#C77B2E" letter-spacing="1.5">STORAGE / CDN · 素材傳遞層</text>
<text x="16" y="684" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#B8860B" letter-spacing="1.5">EXTERNAL SERVICES · Vertex AI / Speech / Maps</text>

<!-- ============ Lane 1: Client ============ -->
<g font-family="Noto Sans TC" font-size="12" font-weight="700">
<rect x="110" y="40" width="330" height="90" rx="12" fill="#FF6A4C"/>
<text x="275" y="72" fill="#fff" text-anchor="middle">玩家手機 App</text>
<text x="275" y="92" fill="#FFE8E0" text-anchor="middle" font-size="10" font-weight="400">Flutter Shell + Unity（AR Engine）</text>
<text x="275" y="108" fill="#FFE8E0" text-anchor="middle" font-size="10" font-weight="400">ARKit / ARCore・SLAM・本機 3D 渲染</text>

<rect x="560" y="40" width="330" height="90" rx="12" fill="#FF6A4C"/>
<text x="725" y="72" fill="#fff" text-anchor="middle">GPS 定位模組</text>
<text x="725" y="92" fill="#FFE8E0" text-anchor="middle" font-size="10" font-weight="400">Fused Location（GPS+WiFi+基地台）</text>
<text x="725" y="108" fill="#FFE8E0" text-anchor="middle" font-size="10" font-weight="400">送出座標 → 觸發召喚請求</text>
</g>

<!-- ============ Lane 2: API ============ -->
<g font-family="Noto Sans TC" font-size="12" font-weight="700">
<rect x="110" y="195" width="330" height="110" rx="12" fill="#1F6F5C"/>
<text x="275" y="225" fill="#fff" text-anchor="middle" font-size="13">Cloud Run（Backend API）</text>
<text x="275" y="245" fill="#EAF4EC" text-anchor="middle" font-size="10" font-weight="400">1 vCPU/1GB・min=1, max=5-10</text>
<text x="275" y="262" fill="#EAF4EC" text-anchor="middle" font-size="10" font-weight="400">POST /summon・/dialogue</text>
<text x="275" y="279" fill="#EAF4EC" text-anchor="middle" font-size="10" font-weight="400">比對 Place → 組 Prompt → 回傳結果</text>

<rect x="560" y="195" width="330" height="110" rx="12" fill="#1F6F5C"/>
<text x="725" y="225" fill="#fff" text-anchor="middle" font-size="13">Cloud Scheduler + Run Jobs</text>
<text x="725" y="245" fill="#EAF4EC" text-anchor="middle" font-size="10" font-weight="400">256MB・每日凌晨排程</text>
<text x="725" y="262" fill="#EAF4EC" text-anchor="middle" font-size="10" font-weight="400">產生「今日情境」JSON</text>
<text x="725" y="279" fill="#EAF4EC" text-anchor="middle" font-size="10" font-weight="400">天氣/節日/人流（不做新聞摘要）</text>
</g>

<!-- ============ Lane 3: Data ============ -->
<g font-family="Noto Sans TC" font-size="12" font-weight="700">
<rect x="110" y="375" width="330" height="95" rx="12" fill="#123D33"/>
<text x="275" y="405" fill="#fff" text-anchor="middle" font-size="13">Cloud SQL for PostgreSQL</text>
<text x="275" y="425" fill="#EAF4EC" text-anchor="middle" font-size="10" font-weight="400">db-custom-2-7680 + pgvector</text>
<text x="275" y="442" fill="#EAF4EC" text-anchor="middle" font-size="10" font-weight="400">結構化資料 + 長期記憶摘要向量檢索</text>

<rect x="560" y="375" width="330" height="95" rx="12" fill="#123D33"/>
<text x="725" y="405" fill="#fff" text-anchor="middle" font-size="13">Memorystore for Redis</text>
<text x="725" y="425" fill="#EAF4EC" text-anchor="middle" font-size="10" font-weight="400">Basic tier・1GB</text>
<text x="725" y="442" fill="#EAF4EC" text-anchor="middle" font-size="10" font-weight="400">Short Memory / 對話 Session 快取</text>
</g>

<!-- ============ Lane 4: Storage / CDN ============ -->
<g font-family="Noto Sans TC" font-size="12" font-weight="700">
<rect x="110" y="540" width="330" height="90" rx="12" fill="#C77B2E"/>
<text x="275" y="572" fill="#fff" text-anchor="middle" font-size="13">Cloud Storage</text>
<text x="275" y="592" fill="#FFEBD6" text-anchor="middle" font-size="10" font-weight="400">Avatar 模型／動畫、人設 YAML</text>
<text x="275" y="608" fill="#FFEBD6" text-anchor="middle" font-size="10" font-weight="400">GET /assets/{avatarId}</text>

<rect x="560" y="540" width="330" height="90" rx="12" fill="#C77B2E"/>
<text x="725" y="572" fill="#fff" text-anchor="middle" font-size="13">Cloud CDN</text>
<text x="725" y="592" fill="#FFEBD6" text-anchor="middle" font-size="10" font-weight="400">掛在 Storage bucket 前</text>
<text x="725" y="608" fill="#FFEBD6" text-anchor="middle" font-size="10" font-weight="400">加速素材傳遞，直接影響 AR 流暢度</text>
</g>

<!-- ============ Lane 5: External Services ============ -->
<g font-family="Noto Sans TC" font-size="12" font-weight="700">
<rect x="60" y="705" width="280" height="120" rx="12" fill="#B8860B"/>
<text x="200" y="737" fill="#fff" text-anchor="middle" font-size="13">Vertex AI・Gemini</text>
<text x="200" y="757" fill="#FFF3D6" text-anchor="middle" font-size="10" font-weight="400">Flash（日常對話）</text>
<text x="200" y="774" fill="#FFF3D6" text-anchor="middle" font-size="10" font-weight="400">Pro（共鳴值解鎖等關鍵時刻）</text>
<text x="200" y="791" fill="#FFF3D6" text-anchor="middle" font-size="10" font-weight="400">動態人格生成</text>
<text x="200" y="808" fill="#FFF3D6" text-anchor="middle" font-size="9" font-weight="400">取代原 OpenAI API</text>

<rect x="360" y="705" width="280" height="120" rx="12" fill="#B8860B"/>
<text x="500" y="737" fill="#fff" text-anchor="middle" font-size="13">Google Cloud Speech</text>
<text x="500" y="757" fill="#FFF3D6" text-anchor="middle" font-size="10" font-weight="400">Text-to-Speech</text>
<text x="500" y="774" fill="#FFF3D6" text-anchor="middle" font-size="10" font-weight="400">Speech-to-Text</text>
<text x="500" y="791" fill="#FFF3D6" text-anchor="middle" font-size="10" font-weight="400">靈魂語音對話</text>
<text x="500" y="808" fill="#FFF3D6" text-anchor="middle" font-size="9" font-weight="400">取代原 Azure Speech</text>

<rect x="660" y="705" width="280" height="120" rx="12" fill="#B8860B"/>
<text x="800" y="737" fill="#fff" text-anchor="middle" font-size="13">Google Maps Platform</text>
<text x="800" y="757" fill="#FFF3D6" text-anchor="middle" font-size="10" font-weight="400">Places API</text>
<text x="800" y="774" fill="#FFF3D6" text-anchor="middle" font-size="10" font-weight="400">Maps SDK</text>
<text x="800" y="791" fill="#FFF3D6" text-anchor="middle" font-size="10" font-weight="400">GPS 座標 ↔ Place 比對</text>
<text x="800" y="808" fill="#FFF3D6" text-anchor="middle" font-size="9" font-weight="400">取代原 Azure Maps</text>
</g>

<!-- 主要資料流箭頭：Client → API -->
<g stroke="#4B5D55" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<path d="M 275 130 L 275 192"/>
<path d="M 700 130 C 550 160, 320 175, 290 192"/>
</g>
<text x="300" y="150" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#4B5D55">① 送出GPS，觸發召喚</text>

<!-- API → Data -->
<g stroke="#1F6F5C" stroke-width="1.5" fill="none" marker-end="url(#arrow-teal)">
<path d="M 240 305 C 240 335, 250 350, 260 372"/>
<path d="M 340 305 C 480 340, 620 355, 700 372"/>
</g>
<text x="330" y="345" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#1F6F5C">② 查詢地點/記憶片段</text>

<!-- API(Scheduler) → Data：寫入每日事件 -->
<g stroke="#1F6F5C" stroke-width="1.3" fill="none" marker-end="url(#arrow-teal)" stroke-dasharray="4,3">
<path d="M 650 305 C 500 335, 350 350, 300 372"/>
</g>
<text x="420" y="330" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#1F6F5C">寫入今日情境（快取一日）</text>

<!-- API → Storage：回傳素材URL -->
<g stroke="#C77B2E" stroke-width="1.3" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3">
<path d="M 150 305 C 90 380, 90 470, 150 538"/>
</g>
<text x="20" y="450" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#C77B2E" transform="rotate(-90 20 450)"></text>

<!-- API → External Services -->
<g stroke="#B8860B" stroke-width="1.3" fill="none" marker-end="url(#arrow-gold)" stroke-dasharray="5,3">
<path d="M 230 305 C 220 450, 210 600, 200 703"/>
<path d="M 300 305 C 380 450, 460 600, 500 703"/>
<path d="M 370 305 C 550 450, 700 600, 800 703"/>
</g>
<text x="255" y="500" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#B8860B">③ 呼叫 LLM／語音／地圖 API</text>

<!-- Storage/CDN → Client：直接下載素材（bypass API） -->
<g stroke="#FF6A4C" stroke-width="1.8" fill="none" marker-end="url(#arrow-coral)" stroke-dasharray="6,3">
<path d="M 850 540 C 950 400, 950 200, 780 128"/>
</g>
<text x="870" y="330" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#FF6A4C" transform="rotate(-90 870 330)">④ 手機直接從CDN下載素材 → 本機AR渲染</text>

<!-- Storage 內部：Storage → CDN -->
<g stroke="#C77B2E" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<path d="M 440 585 L 557 585"/>
</g>
</g>
</svg>
